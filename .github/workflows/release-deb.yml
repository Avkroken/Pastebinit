name: Debian release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild/upload
        required: true

permissions: {}

concurrency:
  group: debian-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable release tag."
            exit 1
          fi
          printf 'value=%s\n' "$RAW_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.value }}
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python python3-all pybuild-plugin-pyproject python3-pip
          sudo pip install --break-system-packages --ignore-installed 'setuptools>=77' 'packaging>=24.2'

      - name: Verify Python release version
        shell: bash
        env:
          RAW_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          tag_version="${RAW_TAG#v}"
          python_version="$(python3 - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          if [[ "$tag_version" != "$python_version" ]]; then
            echo "::error::Release tag $RAW_TAG does not match pyproject.toml version $python_version."
            exit 1
          fi

      - name: Prepare Debian package version
        shell: bash
        env:
          RAW_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          tag_version="${RAW_TAG#v}"
          deb_version="$(dpkg-parsechangelog -SVersion)"
          deb_upstream="${deb_version%-*}"

          if [[ "$deb_upstream" != "$tag_version" ]]; then
            release_date="$(git show -s --format='%aD' HEAD)"
            tmp="$(mktemp)"
            cat > "$tmp" <<EOF
          pastebinit (${tag_version}-1) unstable; urgency=medium

            * Automated Debian package metadata for GitHub release ${RAW_TAG}.
            * User-facing release history is maintained in CHANGELOG.md.

           -- Anders Eriksson <36226327+blixten85@users.noreply.github.com>  ${release_date}

          EOF
            cat debian/changelog >> "$tmp"
            mv "$tmp" debian/changelog
          fi

          final_version="$(dpkg-parsechangelog -SVersion)"
          if [[ "$final_version" != "${tag_version}-1" ]]; then
            echo "::error::Prepared Debian version $final_version does not match ${tag_version}-1."
            exit 1
          fi

      - name: Build package
        run: DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b

      - name: Collect package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find . -maxdepth 1 -type f -name 'pastebinit_*.deb' -print -quit)"
          test -n "$deb"
          echo "path=$deb" >> "$GITHUB_OUTPUT"

      - name: Store package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pastebinit-${{ matrix.arch }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pastebinit-*
          path: packages
          merge-multiple: true

      - name: Upload missing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable release tag."
            exit 1
          fi
          existing="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          while IFS= read -r deb; do
            name="$(basename "$deb")"
            if grep -Fxq "$name" <<< "$existing"; then
              echo "Asset $name already exists; skipping."
              continue
            fi
            gh release upload "$RELEASE_TAG" "$deb" --repo "$GH_REPO"
          done < <(find packages -type f -name 'pastebinit_*.deb' -print | sort)
