name: Build & upload .deb release

# Byggs bara på begäran för en tagg som redan är släppt, och laddas upp till
# den releasen. Ligger i en egen fil eftersom den inte har något på en PR att
# göra — som jobb i en PR-workflow blev den bara en grå överhoppad check.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tagg att bygga .deb för (t.ex. v2.1.5)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deb:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python python3-all pybuild-plugin-pyproject python3-pip
          sudo pip install --break-system-packages --ignore-installed 'setuptools>=77' 'packaging>=24.2'

      - name: Build .deb
        run: DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b

      - name: Upload .deb to release
        run: |
          DEB=$(ls pastebinit_*.deb | head -1)
          gh release upload "${{ inputs.tag }}" "$DEB"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
