name: Debian release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write

concurrency:
  group: debian-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag."
            exit 1
          fi
          printf 'value=%s\n' "$RAW_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.value }}
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python python3-all pybuild-plugin-pyproject python3-pip
          sudo pip install --break-system-packages --ignore-installed 'setuptools>=77' 'packaging>=24.2'

      - name: Build package
        run: DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b

      - name: Upload package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          deb="$(find . -maxdepth 1 -type f -name 'pastebinit_*.deb' -print -quit)"
          test -n "$deb"
          gh release upload "$RELEASE_TAG" "$deb"
