name: Auto-Release
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/auto-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
      - name: Bump version and create tag
        id: tag
        run: |
          git fetch --tags
          LATEST=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v0.1.0"
            CHANGELOG="Initial release"
          else
            COMMITS=$(git log "${LATEST}..HEAD" --pretty=format:"%s" --no-merges)
            if echo "$COMMITS" | grep -qE "BREAKING[- ]CHANGE|^[a-z]+(\(.+\))?!:"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
            case $BUMP in
              major) NEW_TAG="v$((MAJOR+1)).0.0" ;;
              minor) NEW_TAG="v${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
            CHANGELOG=$(git log "${LATEST}..HEAD" --pretty=format:"* %s" --no-merges)
          fi
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          { echo "changelog<<EOF"; echo "$CHANGELOG"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  build-deb:
    needs: tag
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Set version from tag
        run: |
          VERSION="${{ needs.tag.outputs.new_tag }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
          DATE=$(date -R)
          {
            printf 'pastebinit (%s-1) unstable; urgency=medium\n\n' "${VERSION}"
            printf '  * Release %s\n\n' "${VERSION}"
            printf ' -- Anders Eriksson <36226327+blixten85@users.noreply.github.com>  %s\n\n' "${DATE}"
            cat debian/changelog
          } > debian/changelog.new
          mv debian/changelog.new debian/changelog
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-python python3-all pybuild-plugin-pyproject python3-pip
          sudo pip install --break-system-packages 'setuptools>=77'
      - name: Build .deb
        run: DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: deb-${{ matrix.arch }}
          path: "*.deb"

  release:
    needs: [tag, build-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: deb-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: ${{ needs.tag.outputs.changelog }}
          make_latest: true
          files: "*.deb"
