name: Repository policy

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          head-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          pytest

  policy:
    name: Repository policy
    if: ${{ always() }}
    needs: [dependency-review, python]
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          PYTHON: ${{ needs.python.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$DEPENDENCY_REVIEW" "$PYTHON"; do
            [[ "$result" == "success" ]] || { echo "::error::Required job failed: $result"; exit 1; }
          done
