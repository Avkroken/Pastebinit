name: Auto-fix trusted review feedback

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: auto-fix-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hämta App-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-issues: write
      - name: Be Codex åtgärda betrodd review-feedback
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXTRA_TRUSTED_BOTS: ${{ vars.AUTO_FIX_REVIEW_BOTS }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo, pr=context.payload.pull_request;
            if(!pr||pr.head.repo?.full_name!==`${owner}/${repo}`) return;
            const trusted=new Set(['chatgpt-codex-connector[bot]']);
            for(const login of (process.env.EXTRA_TRUSTED_BOTS||'').split(',').map(s=>s.trim()).filter(Boolean)) trusted.add(login);
            const sender=context.payload.sender?.login||'';
            if(!trusted.has(sender)) return;
            let sourceId, sourceUrl, summary;
            if(context.eventName==='pull_request_review_comment'){
              sourceId=`comment-${context.payload.comment.id}`; sourceUrl=context.payload.comment.html_url; summary='inline review-kommentaren';
            }else{
              const review=context.payload.review, body=(review.body||'').trim(), state=(review.state||'').toLowerCase();
              if(!body&&state!=='changes_requested') return;
              sourceId=`review-${review.id}`; sourceUrl=review.html_url; summary='kodreviewn';
            }
            const marker=`<!-- auto-fix-review:${sourceId} -->`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:pr.number,per_page:100});
            if(comments.some(c=>(c.body||'').includes(marker))) return;
            await github.rest.issues.createComment({owner,repo,issue_number:pr.number,body:[marker,`@codex address that feedback from ${summary}: ${sourceUrl}`,'','Ändra endast PR-grenen. Läs och utvärdera feedbacken före ändring. Lös inte review-tråden förrän en relevant fix är pushad och verifierad. Required checks och övriga live-regler avgör när PR:n får mergas.'].join('\n')});
